<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ezclaw-session" content="__EZCLAW_SESSION__" />
    <link rel="icon" href="data:," />
    <title>EZClaw</title>
    <script>
      // Apply a saved manual theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem("ezclaw.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
